[project]
name = "dyano-checker"
version = "0.1.0"
description = "YAML-driven dynamic file-upload form (Django + django-ninja + FastStream)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "django>=5.1,<6",
    "django-ninja>=1.3",
    "pyyaml>=6",
    "faststream[redis]>=0.7",
    "uvicorn[standard]>=0.30",
]

[tool.uv]
package = false
