---
check-requirements:
- name: Category 1
  file-requirements:
    - name: req1
      description: Description for req1
      kind: PDF
    - name: req2
      description: Description for req2
      kind: Drawing
  rules:
    - name: rule1
      description: Description for rule1
      # A skill/gate can be defined inline in the YAML (multi-line content) ...
      skill: |
        You are a document checker. Review the provided documents carefully,
        quote exact evidence, and return a single verdict: pass, fail, or error.
      gate: |
        PASS: the requested information is present and legible.
        FAIL: the requested information is missing, illegible, or contradictory.

- name: Category 2
  file-requirements:
    - name: req3
      description: Description for req3
      kind: PDF
    - name: req4
      description: Description for req4
      kind: Drawing
  rules:
    - name: rule2
      description: Description for rule2
      # ... or reference a file uploaded alongside the rule set by name.
      skill: SKILL2.md
      gate: GATE2.md

# The output template is a separate file uploaded with the rule set.
output-template:
  - file: output.template.xlsx
