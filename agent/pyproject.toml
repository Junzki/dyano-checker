[project]
name = "dyano-agent"
version = "0.1.0"
description = "Dyano Checker LLM agent: PDF extraction, prompt-injection sanitizing, and per-rule checking (Pydantic AI)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-ai[openai]>=0.0.20",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.15",
    "docling>=2.0",
    "paddleocr>=3.0",
    "paddlepaddle>=3.0",
    "pyyaml>=6",
    "openpyxl>=3.1",
]

[tool.uv]
package = false
